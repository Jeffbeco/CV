name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A71375: ${{ secrets.A71375 }}
          B4D533: ${{ secrets.B4D533 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A71375', '')
          tag_b = os.environ.get('B4D533', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 8f490369e0fe1513448a997344613bef99 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 6c299c86d00b1746e09cecae097d67a8de93461609b8674e -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
